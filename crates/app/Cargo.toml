[package]
name = "curlybrace"
description = "Curlybrace: a free, native MongoDB client for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
eframe = "0.32.3"
log = "0.4.26"
curlybrace-core = { path = "../core" }
curlybrace-ui = { path = "../ui" }
tokio ={ version = "1.53.2", features = ["rt-multi-thread"] }

[features]
default = ["gssapi"]
gssapi = ["curlybrace-core/gssapi"]
