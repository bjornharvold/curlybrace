[package]
name = "mongostudio-core"
description = "Driver wrapper, connections, secrets, SSH tunnel and async runtime for The MongoDB GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
bson = "3.1"
dirs = "7.0.0"
futures = "0.3.34"
log = "0.4.26"
keyring = { version = "3.6.3", features = ["apple-native"] }
mongodb = "3.6.0"
russh = "0.63.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[features]
gssapi = ["mongodb/gssapi-auth"]
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
# Integration tests share the fixtures behind the `test-support` feature.
mongostudio-core = { path = ".", features = ["test-support"] }
