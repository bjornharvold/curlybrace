[package]
name = "mongostudio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
async-trait = "0.1.92"
bson = "2.15"
dirs = "7.0.0"
futures = "0.3.34"
keyring = { version = "3.6.3", features = ["apple-native"] }
mongodb = "3.6.0"
russh = "0.63.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[features]
gssapi = ["mongodb/gssapi-auth"]
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
# Integration tests share the fixtures behind the `test-support` feature.
mongostudio-core = { path = ".", features = ["test-support"] }
