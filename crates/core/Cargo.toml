[package]
name = "mongostudio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
bson = "3.1.0"
keyring = { version = "3.6.3", features = ["apple-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
