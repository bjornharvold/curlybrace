[package]
name = "curlybrace-core"
description = "Driver wrapper, connections, secrets, SSH tunnel and async runtime for Curlybrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
bson = "2.15"
dirs = "7.0.0"
futures = "0.3.34"
idna = "1.1.0"
log = "0.4.26"
keyring = { version = "3.6.3", features = ["apple-native"] }
mongodb = "3.6.0"
russh = "0.63.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
gssapi = ["mongodb/gssapi-auth"]
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
# The sampler tests drive tokio's paused clock.
tokio = { version = "1.53.2", features = ["full", "test-util"] }
proptest = "1.5"
# The thinning tests commit from a second connection in the middle of a statement.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
curlybrace-testkit = { path = "../testkit" }
# Integration tests share the fixtures behind the `test-support` feature.
curlybrace-core = { path = ".", features = ["test-support"] }
