[package]
name = "curlybrace-ui"
description = "egui views, view-models and app state for Curlybrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bson = "2.15"
dirs = "7.0.0"
log = "0.4.26"
eframe = "0.32.3"
egui_extras = { version = "0.32.3", default-features = false }
curlybrace-core = { path = "../core" }
serde_json = "1.0.154"
uuid = "1.26.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
curlybrace-core = { path = "../core", features = ["test-support"] }
egui_kittest = { version = "0.32.3", features = ["snapshot", "wgpu"] }
mongodb = "3.6.0"
curlybrace-testkit = { path = "../testkit" }
