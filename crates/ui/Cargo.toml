[package]
name = "mongostudio-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
bson = "2.15"
dirs = "7.0.0"
log = "0.4.26"
eframe = "0.32.3"
egui_extras = { version = "0.32.3", default-features = false }
mongostudio-core = { path = "../core" }
serde_json = "1.0.154"
uuid = "1.26.1"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
mongostudio-core = { path = "../core", features = ["test-support"] }
