name: Build binaries

# Builds the app for every platform in the matrix below and uploads the archives to the
# GitHub release for the given tag. Called by release.yml after a release is created;
# run it by hand (Actions > Build binaries > Run workflow) to rebuild or add assets to
# an existing release.
#
# To support another platform, add a matrix entry and a packaging script. See
# CONTRIBUTING.md ("Adding a platform").

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to upload to, for example v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            package: scripts/package-macos.sh
    runs-on: ${{ matrix.runner }}
    # Only build from main's workflow definition: this job holds a token that can write releases.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag must look like v1.2.3 (got: $TAG)" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # Check out the tag itself, never a branch or a pull request ref.
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@91c3abd82c08dd9739cd868596bc2f9e426bd28e # pinned SHA; toolchain is set below
        with:
          toolchain: 1.87.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p curlybrace --target ${{ matrix.target }}
        env:
          # Keep in step with LSMinimumSystemVersion in scripts/package-macos.sh.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - name: Package
        run: ${{ matrix.package }} "${TAG#v}" ${{ matrix.target }}
        env:
          TAG: ${{ inputs.tag }}
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
