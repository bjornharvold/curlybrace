name: Release

# release-please keeps a "release PR" open on main. Merging that PR bumps the version,
# updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub release; the build job below
# then attaches the binaries to that release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml but cannot update Cargo.lock, and CI builds
  # with --locked. On every push, find the open release PR (if any) and refresh the lockfile
  # on its branch so it stays buildable.
  update-lockfile:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Find the open release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.pr.outputs.branch != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - if: ${{ steps.pr.outputs.branch != '' }}
        uses: dtolnay/rust-toolchain@91c3abd82c08dd9739cd868596bc2f9e426bd28e # pinned; toolchain set below
        with:
          toolchain: 1.87.0
      - name: Refresh Cargo.lock for the bumped version
        if: ${{ steps.pr.outputs.branch != '' }}
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock for the release"
            git push
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
