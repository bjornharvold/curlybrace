version: 2
updates:
  # Third-party actions are pinned to commit SHAs; Dependabot keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
